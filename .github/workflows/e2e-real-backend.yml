name: E2E (Real Backend) - Manual

on:
  workflow_dispatch:

jobs:
  e2e-real:
    name: Cypress E2E against docker-compose backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MySQL + Backend via docker compose
        run: |
          docker compose up -d --build mysql backend

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Backend is up";
              exit 0;
            fi
            sleep 2;
          done
          echo "Backend did not become ready in time";
          docker compose ps;
          docker compose logs --no-color --tail=200 backend || true;
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: eCommerce_Reactjs/package-lock.json

      - name: Run Cypress (real backend spec)
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./eCommerce_Reactjs
          start: npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 180
          browser: chrome
          spec: cypress/e2e/shop-browse.real.cy.js
        env:
          CI: false
          BROWSER: none
          PORT: 3000
          REACT_APP_BACKEND_URL: http://localhost:8080

      - name: Upload Cypress artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-real-${{ github.run_id }}
          path: |
            eCommerce_Reactjs/cypress/screenshots
            eCommerce_Reactjs/cypress/videos
          retention-days: 14

      - name: Shutdown docker compose
        if: always()
        run: |
          docker compose down -v
