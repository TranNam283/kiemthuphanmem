name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: eCommerce_Reactjs/package-lock.json

      - name: Install dependencies
        working-directory: ./eCommerce_Reactjs
        run: npm ci

      - name: Run linter
        working-directory: ./eCommerce_Reactjs
        run: npm run lint || echo "No linter configured"

      - name: Run unit tests
        working-directory: ./eCommerce_Reactjs
        run: |
          set -o pipefail
          npm test -- --coverage --watchAll=false 2>&1 | tee ci-frontend-test.log
        env:
          CI: true

      - name: Run Cypress E2E (smoke)
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./eCommerce_Reactjs
          install: false
          start: npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/homepage.cy.js,cypress/e2e/auth-login.cy.js,cypress/e2e/shop-browse.cy.js,cypress/e2e/cart-view.cy.js
        env:
          CI: false
          BROWSER: none
          PORT: 3000

      - name: Upload Cypress artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ github.run_id }}
          path: |
            eCommerce_Reactjs/cypress/screenshots
            eCommerce_Reactjs/cypress/videos
          retention-days: 14

      - name: Build production
        working-directory: ./eCommerce_Reactjs
        run: npm run build

      - name: Collect short test logs
        if: failure()
        working-directory: ./eCommerce_Reactjs
        run: |
          mkdir -p ci-fail-logs
          LOG_FILE="ci-fail-logs/${GITHUB_JOB}-${GITHUB_RUN_ID}.log"
          echo "==== FRONTEND TEST OUTPUT (tail 100 lines) ====" > "$LOG_FILE"
          tail -n 100 ci-frontend-test.log >> "$LOG_FILE" || true
          cp "$LOG_FILE" ci-fail-logs/test-output.txt

      - name: Upload failure logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fail-logs-frontend-${{ github.run_id }}
          path: |
            eCommerce_Reactjs/ci-fail-logs
            eCommerce_Reactjs/ci-frontend-test.log
          retention-days: 14

      - name: Create GitHub Issue + comment PR (frontend)
        if: failure()
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function safeRead(path) {
              try { return fs.readFileSync(path, 'utf8'); } catch { return ''; }
            }

            function ensureLabel(name, color, description) {
              return github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color,
                description,
              }).catch(() => null);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shortLogPath = 'eCommerce_Reactjs/ci-fail-logs/test-output.txt';
            const shortLog = safeRead(shortLogPath).slice(0, 60000);
            const job = process.env.GITHUB_JOB;
            const workflow = process.env.GITHUB_WORKFLOW;
            const sha = context.sha;
            const prNumber = context.payload.pull_request?.number;

            // Determine severity based on heuristic from log summary.
            const logLine = shortLog.split('\n').find(l => l.startsWith('Tests:')) || '';
            const failedMatch = logLine.match(/(\d+)\s+failed/i);
            const totalMatch = logLine.match(/(\d+)\s+total/i);
            const failed = failedMatch ? Number(failedMatch[1]) : null;
            const total = totalMatch ? Number(totalMatch[1]) : null;
            const failedPct = (failed !== null && total) ? (failed / total) : null;
            const severity = (failedPct !== null && failedPct > 0.5) ? 'severity:high' : 'severity:medium';

            await ensureLabel('ci/failure', 'b60205', 'Automated CI failure');
            await ensureLabel('triage-needed', 'd4c5f9', 'Needs triage/owner assignment');
            await ensureLabel('severity:high', 'b60205', 'High severity CI failure');
            await ensureLabel('severity:medium', 'fbca04', 'Medium severity CI failure');

            const title = `[CI FAIL] ${workflow} - ${job} - frontend tests failed`;
            const body = [
              `**Repository:** ${context.repo.owner}/${context.repo.repo}`,
              `**Workflow:** ${workflow}`,
              `**Job:** ${job}`,
              `**Failing step:** Run unit tests` ,
              `**Commit:** ${sha}`,
              `**PR:** ${prNumber ?? 'N/A'}`,
              `**Run URL:** ${runUrl}`,
              `**Artifact:** ci-fail-logs-frontend-${context.runId}`,
              `**Failing tests (heuristic):** ${failed !== null ? failed : 'UNKNOWN'} / ${total !== null ? total : 'UNKNOWN'}`,
              '',
              '**Short logs (tail 100):**',
              '```',
              shortLog || '(no logs captured)',
              '```',
              '',
              '**Suggested owner(s):** triage-needed (CODEOWNERS KHÔNG TỒN TẠI)',
            ].join('\n');

            let issue;
            try {
              issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci/failure', severity, 'triage-needed'],
              });
            } catch (err) {
              // Fallback: write into docs/CI_FAILURES.md so it can be pushed via PR in the next step.
              const ts = new Date().toISOString();
              const fallbackPath = 'docs/CI_FAILURES.md';
              const entry = [
                `## ${ts} — ${title}`,
                `- Run URL: ${runUrl}`,
                `- Commit: ${sha}`,
                `- Job: ${job}`,
                `- Reason: failed to create issue via API: ${String(err).slice(0, 500)}`,
                '',
                '```',
                shortLog || '(no logs captured)',
                '```',
                '',
              ].join('\n');
              fs.mkdirSync('docs', { recursive: true });
              fs.appendFileSync(fallbackPath, entry);
              console.log(`Issue creation failed; wrote fallback to ${fallbackPath}. ${String(err).slice(0, 300)}`);
              return;
            }

            const pr = context.payload.pull_request;
            if (pr?.number) {
              const commentBody = `CI failed in **${workflow}/${job}**. Opened issue #${issue.data.number}: ${issue.data.html_url}\n\nPlease fix failing tests or add label wontfix.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody,
              });
            }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: eCommerce_Reactjs/build/
          retention-days: 30

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./eCommerce_Reactjs/coverage
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

  create-issue-on-failure:
    name: Create Issue if Tests Failed
    runs-on: ubuntu-latest
    needs: test
    if: false
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Frontend Tests/Build Failed - ${new Date().toLocaleString()}`,
              body: `## 🔴 Frontend Test/Build Failure Report\n\n**Commit:** ${context.payload.head_commit ? context.payload.head_commit.message : 'N/A'}\n**Branch:** ${context.ref}\n**Author:** ${context.actor}\n\n### ⚠️ Build or Tests Failed\n\nPlease check the test/build results and fix the issues:\n\n**Action Required:**\n- [ ] Review error logs\n- [ ] Fix code issues\n- [ ] Run tests locally: \`npm test\`\n- [ ] Build locally: \`npm run build\`\n- [ ] Commit and push fixes\n\n**Build Details:** [View Workflow](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n---\n*Auto-generated by GitHub Actions*`,
              labels: ['bug', 'ci-failure', 'frontend']
            });
            console.log(`✅ Created issue #${issue.data.number}`);
